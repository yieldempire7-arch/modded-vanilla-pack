[hostile_lasso]
	#Percentage of its total health or less a hostile mob must have in order for the lasso to be able to pick it up.
	#Default Value: 0.5
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	hostile_mob_health = 0.5
	#Time in seconds for which a lasso is able to hold a mob.
	#Default Value: 180
	# Default: 180
	# Range: 0 ~ 3600
	holding_time = 180
	#Is the lasso able to hold mobs forever without any time limitation.
	#Default Value: false
	hold_indefinitely = false
	#Time interval in seconds after which the player is hurt by half a heart for carrying any hostile lasso containing a monster.
	#Set to -1 to disable.
	#Default Value: 5
	# Default: 5
	# Range: -1 ~ 3600
	hostile_damage_rate = 5

	#Categories for mobs which can be captured by a lasso.
	#This behavior can be further customized using entity type tags.
	[hostile_lasso.mobs]
		#Night time monsters, illagers, nether creatures, etc.
		#Default Value: true
		monster = true
		#Animals, passive mobs, villagers, etc.
		#Default Value: false
		creature = false
		#Squids, fishes, axolotls, etc.
		#Default Value: false
		aquatic = false

