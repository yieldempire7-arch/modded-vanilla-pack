#The percentage each level of the holding enchantment will increase a lasso's holding time by.
#Default Value: 0.2
# Default: 0.2
# Range: 0.0 ~ 100.0
holding_multiplier = 0.2

[aquatic_lasso]
	#Time in seconds for which a lasso is able to hold a mob.
	#Default Value: 240
	# Default: 240
	# Range: 0 ~ 3600
	holding_time = 240
	#Is the lasso able to hold mobs forever without any time limitation.
	#Default Value: false
	hold_indefinitely = false

	#Categories for mobs which can be captured by a lasso.
	#This behavior can be further customized using entity type tags.
	[aquatic_lasso.mobs]
		#Night time monsters, illagers, nether creatures, etc.
		#Default Value: false
		monster = false
		#Animals, passive mobs, villagers, etc.
		#Default Value: false
		creature = false
		#Squids, fishes, axolotls, etc.
		#Default Value: true
		aquatic = true

[diamond_lasso]
	#Time in seconds for which a lasso is able to hold a mob.
	#Default Value: 120
	# Default: 120
	# Range: 0 ~ 3600
	holding_time = 120
	#Is the lasso able to hold mobs forever without any time limitation.
	#Default Value: true
	hold_indefinitely = true

	#Categories for mobs which can be captured by a lasso.
	#This behavior can be further customized using entity type tags.
