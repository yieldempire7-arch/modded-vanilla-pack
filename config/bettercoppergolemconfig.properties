OPERATION_MODE=19 #Avaible operation mods and their explanation at https://modrinth.com/mod/better-copper-golem | default: 19
MOVEMENT_SPEED=1 #Copper Golem speed modifier [min:1, max:10] | default: 1
CARRY_SIZE=16 #Copper Golem carry size [min:8, max:64] | default: 16 | default: 16
VERTICAL_RANGE=16 #Copper Golem vertical range search modifier [min:2, max:200] | default: 16
HORIZONTAL_RANGE=64 #Copper Golem horizontal range search modifier [min:4, max:1000] | default: 64
MAX_HEALTH=12 #Copper Golem health [min:6, max:64] | default: 12 | default: 12
INTERACTION_SPEED=60 #Copper Golem interaction speed modifier [min:1, max:300] ticks (20 ticks = 1s) | default: 60
INTERACTION_RANGE=1 #Copper Golem interaction reach in blocks [min:1, max:8]; values above 1 let golems reach through thin walls | default: 1
MAX_CHESTS=10 #How many chests Copper Golem checks [min:1, max:1000] | default: 10 | default: 10
POTION_TYPES=1 #1: dont ignore potion types, 0: ignore potion types, -1: ignore potion types but sort tipped arrows separately (ignoring potion types means that for example lingering potion of regen will be sorted with splash poting of regen) | default: 1
BARRELS_SUPPORT=true #Allow Copper Golems to use barrels | default: true
SHULKERS_SUPPORT=true #Allow Copper Golems to use shulker boxes | default: true
MODDED_SUPPORT=true #Allow Copper Golems to use modded containers | default: true
REMEMBER_CHEST_CONTENTS=true #Golems remember chest contents after visiting them | default: true
PRIORITIZE_FILLED_CHESTS=false #Deliver items into chests that already contain them first; empty chests are a last resort (uses the golem's remembered contents) | default: false
SIMILAR_ITEMS=false #Sort visually-similar items (dye/wood variants, damaged tools) into the same chest via item tags | default: false
RETURN_UNPLACEABLE=false #Return a held item that fits nowhere to the copper chest and ignore that type for IGNORE_DURATION instead of looping | default: false
IGNORE_DURATION=1200 #Ticks a returned/unplaceable item type stays ignored (20=1s) [min:100, max:24000] | default: 1200
SHARE_MEMORY=false #Nearby copper golems exchange remembered chest contents (needs REMEMBER_CHEST_CONTENTS) | default: false
MEMORY_SHARE_RANGE=8 #Radius in blocks within which golems share memory [min:1, max:64] | default: 8

